name: Build Google Play bundle

# Separate from build-android.yml on purpose. This workflow:
#   - only runs when started by hand (Actions tab > Build Google Play bundle > Run workflow),
#   - only builds a signed .aab for uploading to Play Console,
#   - never touches the "latest" GitHub Release or the sideload APK that blackbox.html links to,
#   - uses its own PLAY_* secrets, so adding them does not switch on the release-APK steps in
#     build-android.yml.
# Nothing in android-app/ is changed in the repo: the version number is passed in at build time.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets are set
        env:
          KS: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::PLAY_UPLOAD_KEYSTORE_BASE64 secret is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode upload keystore
        run: echo "${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > android/app/play-upload.jks

      # Play rejects any upload whose versionCode is not higher than the previous one.
      # The run number of this workflow always goes up, so it is used as the versionCode.
      - name: Build signed release bundle (.aab)
        env:
          KS_PASS: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        working-directory: android-app/android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.version.code=${{ github.run_number }} \
            -Pandroid.injected.version.name=1.0.${{ github.run_number }} \
            -Pandroid.injected.signing.store.file=play-upload.jks \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Remove keystore from runner
        if: always()
        run: rm -f android/app/play-upload.jks

      # Private build artifact only (download from this run's Summary page), never a public release.
      - name: Upload .aab
        uses: actions/upload-artifact@v4
        with:
          name: airplot-play-aab-v${{ github.run_number }}
          path: android-app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 90
