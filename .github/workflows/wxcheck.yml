name: Check one spot (one-off)
on:
  workflow_dispatch: {}
  push:
    branches: [vis-check, vis-rh, cbh-check]
    paths: ['wxtiles/check_params.py', 'wxtiles/check_vis.py', 'wxtiles/vis_rules.py', '.github/workflows/wxcheck.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy requests eccodes eccodeslib && cd wxtiles && python check_params.py
