name: GFA vs model check (test branch only)
# (2026-11-23, CN) runs only on the gfa-compare branch: NAV CANADA GFA icing / turbulence charts (all 7 regions) next to the
# model icing / turbulence for the same valid times - artifact "gfacmp". Not for main.
on:
  push:
    branches: [gfa-compare]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy requests boto3 eccodes eccodeslib matplotlib cartopy
      - name: Build the latest run (up to +30 h) with the new AND the old icing / turbulence rules
        working-directory: wxtiles
        env: { WX_OUT: '${{ github.workspace }}/site/wx', WX_MAX_STEP: '30', WX_DER_MAX_STEP: '30', WX_OLD: '1' }
        run: python build_tiles.py 2>&1 | tail -40
      - run: WX_LOCAL=site/wx python wxtiles/gfa_compare.py 2>&1 | tee gfacmp_log.txt
      - name: Results to the gfa-compare-out branch (images + summary + log)
        if: always()
        run: |
          mkdir -p /tmp/o && cp -r gfacmp /tmp/o/ && cp gfacmp_log.txt /tmp/o/ || true
          cd /tmp/o && git init -q && git checkout -q -b gfa-compare-out && git add -A
          git -c user.name=gfa-check -c user.email=actions@github.com commit -q -m "GFA vs model check output"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gfa-compare-out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: gfacmp, path: gfacmp, retention-days: 7 }
